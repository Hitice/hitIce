name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: Log every repository the analysis reads
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token secret
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Set the METRICS_TOKEN secret: gh secret set METRICS_TOKEN -R Hitice/hitIce"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Sums the language bytes of every repository I own, public and private, through the
      # GitHub API (the in-depth mode cannot clone private repositories in v3.34). The action's
      # own commit step fails with "sha wasn't supplied" in v3.34, so it only renders and the
      # next step commits.
      - name: Languages from the code
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          debug: ${{ inputs.debug && 'yes' || 'no' }}
          base: ""
          config_timezone: America/Sao_Paulo
          config_display: large
          repositories_affiliations: owner
          commits_authoring: Hitice, hitice, Pedro Henrique Fernandes, Pedro Fernandes, Pavanelli, Pedro Ford, adm.nuvem@protonmail.com
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0.5%
          plugin_languages_ignored: html, css, scss, batchfile, dockerfile, mako, makefile, procfile, shell, powershell, json, yaml, markdown, text

      - name: Commit the image
        run: |
          sudo cp /metrics_renders/metrics.languages.svg ./metrics.languages.svg
          sudo chown "$(id -u):$(id -g)" metrics.languages.svg
          if git diff --quiet -- metrics.languages.svg && git ls-files --error-unmatch metrics.languages.svg >/dev/null 2>&1; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.languages.svg
          git commit -m "chore: update language metrics"
          git pull --rebase
          git push
