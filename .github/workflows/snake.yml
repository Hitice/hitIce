name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gera a animação Snake 🐍
        uses: Platane/snk@v3
        with:
          github_user_name: Hitice
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#5a3eae&color_dots=#ebedf0,#c6d2f5,#8fa9e8,#5a7fd0,#3b5bb5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bf91f3&color_dots=#161b22,#28415f,#35598a,#4a7fc0,#70a5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publica no branch `output`
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
